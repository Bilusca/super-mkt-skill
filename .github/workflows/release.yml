name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Build artifacts
        run: ./build.sh

      - name: Attach zip and prompt to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/super-mkt.zip
            dist/PROMPT.md

      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "super-mkt@$VERSION" version >/dev/null 2>&1; then
            echo "super-mkt@$VERSION is already on npm — skipping publish"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
